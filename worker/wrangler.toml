name = "biocatalystfeed-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Per-IP daily counters. Create with: npx wrangler kv namespace create RATE_LIMIT
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Per-IP burst limit (Workers Rate Limiting, free, needs wrangler >= 4.36). Required: the Worker fails closed without it.
[[ratelimits]]
name = "BURST"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

[vars]
KV_DAILY = "0"   # set "1" only on a paid plan (each uncached request = 1 KV write)
DAILY_LIMIT = "200"
CACHE_TTL = "900"
ALLOWED_ORIGINS = "https://biocat.ai,https://www.biocat.ai,https://biocatalystfeed.com,https://www.biocatalystfeed.com,https://biocatalystfeed.github.io"

# Optional custom domain once the zone is on Cloudflare:
# routes = [{ pattern = "api.biocatalystfeed.com", custom_domain = true }]
