name: Update headlines

on:
  schedule:
    # Daily, off the hour. The populator waits out source crawl-delays itself.
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: headlines
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Populate headlines
        run: node scripts/headlines/populate.mjs
      - name: Commit data/headlines.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/headlines.json
          if git diff --cached --quiet; then
            echo "No headline changes."
            exit 0
          fi
          git commit -m "Update headlines from public sources"
          git push
