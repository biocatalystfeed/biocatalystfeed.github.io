name: Update headlines

on:
  schedule:
    # Four times a day, off the hour. 13:20 UTC is 22:20 JST (10:20 PM).
    # The populator waits out source crawl-delays itself.
    - cron: "20 1,7,13,19 * * *"
  workflow_dispatch:
  # A change to the picks file refreshes headlines without waiting for cron.
  # The job commits only data/headlines.json, which is outside this path
  # filter. A push made with GITHUB_TOKEN does not start workflows either,
  # so the populate commit cannot run this job again.
  push:
    branches: [main]
    paths:
      - data/x_picks.json

permissions:
  contents: write

concurrency:
  group: headlines-update
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: .cache/headlines
          key: headlines-http-v1
      - name: Populate headlines
        # Reads data/x_picks.json from this checkout. The scheduled run is main,
        # so a later data-only commit on main is applied on the next run.
        env:
          HEADLINES_CACHE_DIR: ${{ github.workspace }}/.cache/headlines
        run: node scripts/headlines/populate.mjs
      - name: Commit data/headlines.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/headlines.json
          if git diff --cached --quiet; then
            echo "No headline changes."
            exit 0
          fi
          git commit -m "Update headlines from public sources"
          git push
