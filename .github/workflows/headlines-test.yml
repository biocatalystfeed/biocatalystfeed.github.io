name: Headlines tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run headlines tests
        run: node --test scripts/headlines/test/*.test.mjs worker-timer/test/timer.test.mjs
